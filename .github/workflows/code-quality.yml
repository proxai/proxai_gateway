name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check:
    name: Typecheck + Lint + Format + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Tests with coverage
        run: bun run test:cov
        timeout-minutes: 8

  raw-coverage:
    name: Raw bun coverage (native reporter)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - name: Raw bun test --coverage (native reporter, no custom parsing)
        shell: bash
        env:
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: |
          set +e
          echo "::stop-commands::rawbun"
          bun test --timeout 30000 --retry 2 --coverage 2>&1 | tee raw-bun-coverage.txt
          echo "::rawbun::"
          exit 0
      - name: Upload raw bun coverage output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-bun-coverage-linux-x64
          path: raw-bun-coverage.txt
