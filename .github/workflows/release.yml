name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  version:
    name: compute version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute version
        id: compute
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "computed version=${version} tag=${tag}"

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: [version]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            ext: ''
            runner: macos-latest
          - target: linux-arm64
            ext: ''
            runner: ubuntu-latest
          - target: linux-x64
            ext: ''
            runner: ubuntu-latest
          - target: windows-x64
            ext: '.exe'
            runner: ubuntu-latest
          - target: windows-arm64
            ext: '.exe'
            runner: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stamp version into package.json
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build ${{ matrix.target }}
        run: bun run build:${{ matrix.target }}

      - name: Verify ad-hoc signature (darwin)
        if: startsWith(matrix.target, 'darwin')
        run: codesign --verify --verbose=2 dist/${{ matrix.target }}/proxai-gateway

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: proxai-gateway-${{ matrix.target }}
          path: dist/${{ matrix.target }}/proxai-gateway${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    runs-on: ubuntu-latest
    needs: [version, build]
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.version.outputs.tag }}
      version: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release
          declare -A REMAP=(
            [darwin-arm64]=darwin-arm64
            [linux-arm64]=linux-arm64
            [linux-x64]=linux-x64
            [windows-x64]=win32-x64
            [windows-arm64]=win32-arm64
          )
          declare -A EXT=(
            [darwin-arm64]=''
            [linux-arm64]=''
            [linux-x64]=''
            [windows-x64]='.exe'
            [windows-arm64]='.exe'
          )
          for target in "${!REMAP[@]}"; do
            src="artifacts/proxai-gateway-${target}/proxai-gateway${EXT[$target]}"
            dst="release/proxai-gateway-${REMAP[$target]}${EXT[$target]}"
            if [ ! -f "$src" ]; then
              echo "missing artifact: $src" >&2
              exit 1
            fi
            cp "$src" "$dst"
            chmod +x "$dst" || true
          done
          ls -la release/

      - name: Generate checksums
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum proxai-gateway-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: 'true'

  npm-publish:
    name: npm publish
    runs-on: ubuntu-latest
    needs: [version, release]
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stamp version into package.json
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Prepare npm-build
        run: bun scripts/publish-npm.ts

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        working-directory: npm-build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag latest

      - name: Skip npm publish (NPM_TOKEN not configured)
        if: ${{ env.NPM_TOKEN == '' }}
        run: echo "::warning::NPM_TOKEN secret is not configured; skipping npm publish for ${{ needs.version.outputs.version }}"
