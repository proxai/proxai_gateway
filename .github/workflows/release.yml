name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            ext: ''
          - target: darwin-x64
            ext: ''
          - target: linux-arm64
            ext: ''
          - target: linux-x64
            ext: ''
          - target: windows-x64
            ext: '.exe'
          - target: windows-arm64
            ext: '.exe'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build ${{ matrix.target }}
        run: bun run build:${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxai-gateway-${{ matrix.target }}
          path: dist/${{ matrix.target }}/proxai-gateway${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release
          # Map build target -> Node-style platform suffix used by install scripts
          # (windows -> win32 in the published binary names so install.ps1 can find them).
          declare -A REMAP=(
            [darwin-arm64]=darwin-arm64
            [darwin-x64]=darwin-x64
            [linux-arm64]=linux-arm64
            [linux-x64]=linux-x64
            [windows-x64]=win32-x64
            [windows-arm64]=win32-arm64
          )
          declare -A EXT=(
            [darwin-arm64]=''
            [darwin-x64]=''
            [linux-arm64]=''
            [linux-x64]=''
            [windows-x64]='.exe'
            [windows-arm64]='.exe'
          )
          for target in "${!REMAP[@]}"; do
            src="artifacts/proxai-gateway-${target}/proxai-gateway${EXT[$target]}"
            dst="release/proxai-gateway-${REMAP[$target]}${EXT[$target]}"
            if [ ! -f "$src" ]; then
              echo "missing artifact: $src" >&2
              exit 1
            fi
            cp "$src" "$dst"
            chmod +x "$dst" || true
          done
          ls -la release/

      - name: Generate checksums
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum proxai-gateway-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
